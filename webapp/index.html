<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>I.A.M. NoteWorthy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/style.css" />
</head>
<body>

<div class="phone-frame">
  <div class="app">

    <!-- ===== BOTTOM-NAV SCREENS WRAPPER ===== -->
    <div class="screens">

      <!-- ===== RECORD SCREEN ===== -->
      <section class="screen active" id="screen-record">
        <p class="eyebrow-free-label">Wednesday, 10:30 lecture</p>
        <h1 id="record-heading">Ready for class?</h1>
        <p class="subtext" id="record-subtext">Hit record when your professor starts talking.</p>

        <div class="mascot-wrap">
          <div class="mascot-sprite state-blink" id="mascot"></div>
        </div>

        <div class="timer" id="timer">00:00</div>

        <div class="controls" id="idle-controls">
          <button class="record-btn" id="btn-record" aria-label="Start recording"></button>
        </div>

        <div class="controls active-controls hidden" id="active-controls">
          <button class="pill-btn" id="btn-pause">Pause</button>
          <button class="pill-btn pill-stop" id="btn-stop">Stop</button>
        </div>

        <div class="controls review-controls hidden" id="review-controls">
          <button class="generate-btn" id="btn-generate">Generate my notes</button>
          <button class="text-btn" id="btn-resume-after-stop">Actually, keep recording</button>
        </div>

        <button class="add-btn" id="btn-add">+ Add photo or slide</button>
        <input type="file" id="file-input" accept="image/*,.pdf,.pptx" capture="environment" hidden multiple />

        <div class="uploads-strip hidden" id="uploads-strip"></div>
      </section>

      <!-- ===== PROCESSING SCREEN ===== -->
      <section class="screen" id="screen-processing">
        <div class="mascot-wrap">
          <div class="walk-stage">
            <div class="walk-ground" id="walk-ground"></div>
            <div class="walk-cat" id="walk-cat"></div>
          </div>
        </div>
        <h1>Putting it all together</h1>
        <p class="subtext" id="processing-status">Listening back to the lecture...</p>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </section>

      <!-- ===== NOTES RESULT SCREEN ===== -->
      <section class="screen" id="screen-notes">
        <div class="notes-header">
          <div class="mascot-sprite state-tailwag mascot-small"></div>
          <div>
            <h1>Your notes are ready</h1>
            <p class="subtext">Data Engineering &middot; 42 min</p>
          </div>
        </div>

        <p class="section-label">Key concepts</p>
        <div class="chip-row" id="chip-row"></div>

        <p class="section-label">Summary</p>
        <div class="card summary-card" id="summary-card"></div>

        <p class="section-label">Full notes</p>
        <div class="timeline" id="timeline"></div>

        <button class="notion-btn" id="btn-notion">Save to Notion</button>
        <p class="notion-status hidden" id="notion-status">Saved to your Notion workspace.</p>

        <button class="text-btn" id="btn-new-session">Start a new session</button>
      </section>

    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-nav="record">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/></svg>
        Record
      </button>
      <button class="nav-item" data-nav="history">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        History
      </button>
    </nav>

    <!-- ===== HISTORY SCREEN (overlay) ===== -->
    <section class="screen history-screen" id="screen-history">
      <h1>Past sessions</h1>
      <div class="history-list" id="history-list"></div>
    </section>

  </div>
</div>

<script src="static/app.js"></script>
</body>
</html>
